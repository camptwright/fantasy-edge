# Optional Debian-host bind mounts. Create the tree before first `up`:
#   mkdir -p /home/reek/apps/fantasy-edge/{postgres,redis,models,logs}
# No sudo needed - reek owns its own home directory (no /opt or /srv access
# on reekserver-1; see the other apps' DEPLOYMENT.md for the same pattern).

services:
  postgres:
    volumes:
      - /home/reek/apps/fantasy-edge/postgres:/var/lib/postgresql/data

  redis:
    volumes:
      - /home/reek/apps/fantasy-edge/redis:/data

  api:
    volumes:
      - /home/reek/apps/fantasy-edge/models:/mnt/data/fantasy-edge/models
      - /home/reek/apps/fantasy-edge/logs:/app/logs

  worker:
    volumes:
      - /home/reek/apps/fantasy-edge/models:/mnt/data/fantasy-edge/models
      - /home/reek/apps/fantasy-edge/logs:/app/logs

  evaluation:
    volumes:
      - /home/reek/apps/fantasy-edge/models:/mnt/data/fantasy-edge/models
      - /home/reek/apps/fantasy-edge/logs:/app/logs

  beat:
    volumes:
      - /home/reek/apps/fantasy-edge/logs:/app/logs

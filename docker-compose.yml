# Fantasy Edge stack.
#
name: fantasy-edge

networks:
  fantasy:

volumes:
  pgdata:
  redisdata:
  modeldata:
  rawdata:

x-app: &app
  build:
    context: .
    dockerfile: Dockerfile
  restart: unless-stopped
  networks: [fantasy]
  env_file: [.env]
  volumes:
    - "modeldata:/mnt/data/fantasy-edge/models"
    - "rawdata:/mnt/data/fantasy-edge/raw"
  logging: {driver: json-file, options: {max-size: "10m", max-file: "3"}}
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [fantasy]
    environment:
      POSTGRES_USER: "${POSTGRES_USER:-fantasy}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}"
      POSTGRES_DB: "${POSTGRES_DB:-fantasy_edge}"
    volumes: ["pgdata:/var/lib/postgresql/data"]
    mem_limit: 1024m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-fantasy}"]
      interval: 10s
      retries: 5
      start_period: 30s

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    networks: [fantasy]
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "256mb", "--maxmemory-policy", "noeviction"]
    volumes: ["redisdata:/data"]
    mem_limit: 384m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      retries: 5

  api:
    <<: *app
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    expose: ["8000"]
    environment:
      ADJUTANT_API_URL: "${ADJUTANT_API_URL:-}"
      ADJUTANT_API_TOKEN: "${ADJUTANT_API_TOKEN:-}"
      FANTASY_PARLAY_TOKEN: "${FANTASY_PARLAY_TOKEN:-}"
      FANTASY_API_TOKEN: "${FANTASY_API_TOKEN:?set FANTASY_API_TOKEN in .env}"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}
    mem_limit: 768m

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    command: ["alembic", "upgrade", "head"]
    networks: [fantasy]
    env_file: [.env]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  worker:
    <<: *app
    # Concurrency 2 on a 4-core box leaves headroom for the API and Postgres.
    command: ["celery", "-A", "src.scheduler.celery_app", "worker", "--loglevel=info", "--concurrency=2"]
    mem_limit: 1536m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  evaluation:
    <<: *app
    # Isolate historical evaluation from ingestion and recycle its process.
    command: ["celery", "-A", "src.scheduler.celery_app", "worker", "--loglevel=info", "--concurrency=1", "-Q", "evaluation", "--max-tasks-per-child=1"]
    mem_limit: 1536m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  beat:
    <<: *app
    command: ["celery", "-A", "src.scheduler.celery_app", "beat", "--loglevel=info"]
    mem_limit: 256m
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      migrate: {condition: service_completed_successfully}

  dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    networks: [fantasy]
    # No host port publish: reekserver-1's shared cloudflared container
    # reaches it over this compose network by container name once connected
    # (see DEPLOYMENT.md), same pattern as every other app on that host.
    expose: ["3000"]
    environment:
      NODE_ENV: production
      FANTASY_API_URL: http://api:8000
      FANTASY_API_TOKEN: "${FANTASY_API_TOKEN:?set FANTASY_API_TOKEN in .env}"
      # Remote dashboard remains fail-closed in middleware when unset.
      FANTASY_LOCAL_ONLY: "false"
      CF_ACCESS_TEAM_DOMAIN: "${CF_ACCESS_TEAM_DOMAIN:-}"
      CF_ACCESS_AUD: "${CF_ACCESS_AUD:-}"
    mem_limit: 512m

  litellm:
    image: ghcr.io/berriai/litellm:main-latest@sha256:d1fc1c122e2c1a0cec2b00540b220ff0d2682842758eb8bc64e373a1aedfec7e
    networks: [fantasy]
    command: ["--config", "/config/litellm.yaml", "--port", "4000"]
    environment:
      OLLAMA_BASE_URL: "${OLLAMA_BASE_URL:?set OLLAMA_BASE_URL in .env}"
      LITELLM_MASTER_KEY: "${LITELLM_API_KEY:?set LITELLM_API_KEY in .env}"
    volumes: ["./deploy/litellm.yaml:/config/litellm.yaml:ro"]
    read_only: true
    tmpfs: ["/tmp:rw,noexec,nosuid,size=64m"]
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    # No mem_limit: verified live 2026-08-29 that both 256m and 512m
    # OOM-killed this image in a restart loop (`docker events` showed a
    # continuous oom -> die -> start cycle at both values) - the
    # ghcr.io/berriai/litellm image needs more than this app's other
    # services do. The other reekserver-1 apps' litellm sidecars
    # (adjutant, wellthread, homelab-dashboard) all run this same image
    # unconstrained; matching that working pattern rather than guessing at
    # another number.

  # No dedicated ntfy service as of 2026-09: alerts now publish to the
  # shared reekserver-1 ntfy instance (see the standalone `ntfy` repo) at
  # NTFY_BASE_URL=https://ntfy.camptwright.com, topic fantasy-edge-alerts,
  # over the public internet rather than the LAN. Retired the per-app
  # container (and its `ntfydata` volume) to stop running three separate
  # ntfy deployments fleet-wide for one notification bus. See .env.example
  # and DEPLOYMENT.md's "ntfy alerting" section for the token setup this
  # needs on the shared instance.

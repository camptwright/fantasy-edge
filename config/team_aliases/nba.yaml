# NBA team identifiers -> ESPN canonical displayName/id, fetched live
# against site.api.espn.com's /basketball/nba/teams endpoint on
# 2026-09-04 - not from memory. Same shape as nfl.yaml/ncaaf.yaml
# (constraint #24 in CLAUDE.md): every key is quoted because ESPN's own
# abbreviation for New Orleans is the bare string "NO", which PyYAML's
# YAML-1.1 safe_load parses as the boolean False unless quoted - the
# exact bug nfl.yaml's own alias file already hit once for the Saints.

# Maps the NHL API v1's team abbreviations (`abbrev` field -
# src/data/historical/nhl_loader.py's TEAM_ABBREVIATIONS list) to ESPN's
# canonical displayName + espn_id. Both sides fetched live on 2026-08-06 -
# not from memory. Several NHL-API codes intentionally differ from ESPN's
# own abbreviation for the same team (LAK vs LA, NJD vs NJ, SJS vs SJ, TBL
# vs TB, UTA vs UTAH) - this file exists specifically because of that
# mismatch, on top of the historical_team_name/canonical-identity problem
# constraint #24 describes.
aliases:
  ANA: {espn_name: "Anaheim Ducks", espn_id: "25"}
  # Arizona Coyotes relocated and rebranded as Utah's franchise after the
  # 2023-24 season - same franchise, same canonical identity as UTA below.
  # The NHL schedule API still serves ARI for the seasons it played under
  # that name (see nhl_loader.py's own comment on this exact team).

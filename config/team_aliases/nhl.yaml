# NHL team identifiers -> ESPN canonical displayName/id. Keyed by the
# NHL API's OWN abbreviation (api-web.nhle.com's teamAbbrev, the
# primary NHL schedule source - src/ingest/nhl.py), not ESPN's shorter
# codes - the two disagree for five teams (LAK/NJD/SJS/TBL/UTA here vs
# ESPN's LA/NJ/SJ/TB/UTAH), the same reason nfl.yaml is keyed by
# nflverse abbreviations rather than ESPN's. Matched to ESPN by
# accent-stripped full team name (Montreal/Montréal is the one accent
# mismatch) against a live /hockey/nhl/teams response, both fetched
# 2026-09-04 - not from memory. Every key quoted per constraint #24
# even though no current NHL abbreviation is a YAML boolean trap.

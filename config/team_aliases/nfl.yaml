# Maps nfl_data_py's team abbreviations (src/data/historical/nfl_loader.py)
# to ESPN's canonical displayName + espn_id, fetched live against
# site.api.espn.com's /teams endpoint on 2026-08-06 - not from memory.
# Covers the current 32-team alignment; nfl_data_py's older-season
# relocation-era abbreviations (e.g. pre-2016 STL, pre-2017 SD, pre-2020
# OAK) are not covered since this repo's own usage seeds recent seasons
# only (see seed_historical.py's docstring example: `--seasons 2023 2024`).
aliases:
  ARI: {espn_name: "Arizona Cardinals", espn_id: "22"}
  ATL: {espn_name: "Atlanta Falcons", espn_id: "1"}
  BAL: {espn_name: "Baltimore Ravens", espn_id: "33"}
  BUF: {espn_name: "Buffalo Bills", espn_id: "2"}
  CAR: {espn_name: "Carolina Panthers", espn_id: "29"}
  CHI: {espn_name: "Chicago Bears", espn_id: "3"}
  CIN: {espn_name: "Cincinnati Bengals", espn_id: "4"}
  CLE: {espn_name: "Cleveland Browns", espn_id: "5"}
  DAL: {espn_name: "Dallas Cowboys", espn_id: "6"}
  DEN: {espn_name: "Denver Broncos", espn_id: "7"}
  DET: {espn_name: "Detroit Lions", espn_id: "8"}
  GB: {espn_name: "Green Bay Packers", espn_id: "9"}
  HOU: {espn_name: "Houston Texans", espn_id: "34"}
  IND: {espn_name: "Indianapolis Colts", espn_id: "11"}
  JAX: {espn_name: "Jacksonville Jaguars", espn_id: "30"}
  KC: {espn_name: "Kansas City Chiefs", espn_id: "12"}
  LV: {espn_name: "Las Vegas Raiders", espn_id: "13"}
  LAC: {espn_name: "Los Angeles Chargers", espn_id: "24"}
  LAR: {espn_name: "Los Angeles Rams", espn_id: "14"}
  MIA: {espn_name: "Miami Dolphins", espn_id: "15"}
  MIN: {espn_name: "Minnesota Vikings", espn_id: "16"}
  NE: {espn_name: "New England Patriots", espn_id: "17"}
  # Unquoted, YAML 1.1's boolean literal set (PyYAML's safe_load) parses
  # bare "NO" as False, not the string "NO" - found live when the
  # backfill migration tried to bind a Python bool into a varchar
  # comparison and Postgres rejected it outright, not silently.
  "NO": {espn_name: "New Orleans Saints", espn_id: "18"}
  NYG: {espn_name: "New York Giants", espn_id: "19"}
  NYJ: {espn_name: "New York Jets", espn_id: "20"}
  PHI: {espn_name: "Philadelphia Eagles", espn_id: "21"}
  PIT: {espn_name: "Pittsburgh Steelers", espn_id: "23"}
  SF: {espn_name: "San Francisco 49ers", espn_id: "25"}
  SEA: {espn_name: "Seattle Seahawks", espn_id: "26"}
  TB: {espn_name: "Tampa Bay Buccaneers", espn_id: "27"}
  TEN: {espn_name: "Tennessee Titans", espn_id: "10"}
  # nfl_data_py's convention for Washington isn't independently verified
  # from this environment (no live nfl_data_py install to check against) -
  # both spellings map to the same team so either is a safe hedge, not a
  # guess that could attach to the wrong franchise.
  WAS: {espn_name: "Washington Commanders", espn_id: "28"}
  WSH: {espn_name: "Washington Commanders", espn_id: "28"}

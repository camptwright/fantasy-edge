[project]
name = "fantasy-edge"
version = "0.1.0"
description = "Self-hosted live sports betting value engine and fantasy optimizer"
requires-python = ">=3.12"

dependencies = [
  # web / api
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # db
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "greenlet>=3.1",
  # queue
  "celery[redis]>=5.4",
  "redis>=5.2",
  "flower>=2.0",
  # http / logging
  "httpx>=0.28",
  "structlog>=24.4",
  "pyyaml>=6.0",
  # modelling
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "numpy>=2.0",
  "scipy>=1.14",
  # optimisation
  "pulp>=2.9",
  # llm
  "openai>=1.57",
]

[project.optional-dependencies]
historical = [
  "nfl_data_py>=0.3.2",
  "cfbd>=4.6",
  "pybaseball>=2.2",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

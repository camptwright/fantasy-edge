[project]
name = "fantasy-edge"
version = "0.1.0"
description = "NFL sports betting value engine foundation"
requires-python = ">=3.12"

dependencies = [
  # settings
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  # db
  "sqlalchemy[asyncio]>=2.0.36",
  "asyncpg>=0.30",
  # Alembic runs synchronously and cannot use the asyncpg driver. Without a
  # sync driver installed, `alembic upgrade head` dies with
  # ModuleNotFoundError: psycopg2 (SQLAlchemy's default for bare postgresql://).
  "psycopg[binary]>=3.2",
  "alembic>=1.14",
  "greenlet>=3.1",
  # http / logging
  "httpx>=0.28",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
offline = [
  # nflreadpy is the maintained Python port of nflverse/nflreadr. It returns
  # Polars frames and is used only by the offline NFL ingestion/training jobs.
  "nflreadpy>=0.1.1",
  "appdirs>=1.4",
  # modelling (training only, not needed in serving image)
  "xgboost>=2.1",
  "lightgbm>=4.5",
  "scikit-learn>=1.5",
  "pandas>=2.2",
  "scipy>=1.14",
]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
